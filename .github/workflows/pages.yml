name: leaderboards

# Rebuilds LEADERBOARD.md files, the README table and the GitHub Pages site
# (https://buddhistai.github.io/buddhist-benchmarks/) whenever results change,
# and once a day so new BuddhistBench runs in BuddhistAI/buddhist-bench show up.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BuddhistAI/buddhist-bench
          path: _bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate Markdown leaderboards
        run: python3 scripts/build_leaderboards.py
      - name: Commit regenerated Markdown, if it changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Regenerate leaderboards [skip ci]"
            git push
          fi
      - name: Build site
        run: python3 scripts/build_leaderboards.py --site _site --bench _bench --fetch-external
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
